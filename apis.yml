name: Proterra
description: 'Proterra is a US-based manufacturer of high-energy lithium-ion battery systems for electric
  vehicles and commercial equipment, including transit buses, trucks, and off-highway EVs, with charging
  and fleet solutions. Originally an electric transit bus and powertrain manufacturer founded in 2004,
  the battery-systems business (Powered by Proterra) continues under the proterra.com domain following the
  2023 restructuring. It is a physical hardware and energy-storage company backed by Obvious Ventures under
  its planetary-health thesis, and publishes no public developer portal, API, or machine-readable API
  surface as of this enrichment pass.'
